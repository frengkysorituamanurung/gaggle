[workspace]
resolver = "2"
members = [
    "crates/gaggle-core",
    "crates/gaggle-db",
    "crates/gaggle-tools",
    "crates/gaggle-mcp",
    "crates/gaggle-recipes",
    "crates/gaggle-server",
    "crates/gaggle-cli",
    "crates/gaggle-ui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/frengky/gaggle"

[workspace.dependencies]
gaggle-core = { path = "crates/gaggle-core" }
gaggle-db = { path = "crates/gaggle-db" }
gaggle-tools = { path = "crates/gaggle-tools" }
gaggle-mcp = { path = "crates/gaggle-mcp" }
gaggle-recipes = { path = "crates/gaggle-recipes" }
gaggle-server = { path = "crates/gaggle-server" }
gaggle-ui = { path = "crates/gaggle-ui" }

anyhow = "1"
async-stream = "0.3"
async-trait = "0.1"
axum = { version = "0.8", features = ["ws", "macros"] }
clap = { version = "4", features = ["derive"] }
croner = "4"
directories = "6"
futures = "0.3"
minijinja = "3"
portable-pty = "0.9"
notify = "8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sha2 = "0.11"
similar = "3"
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tower = "0.5"
tower-http = { version = "0.7", features = ["cors", "trace", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
