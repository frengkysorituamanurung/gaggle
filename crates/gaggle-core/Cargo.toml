[package]
name = "gaggle-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
local-inference = ["dep:llama-cpp-2"]
oidc = ["dep:jsonwebtoken"]
telemetry = ["dep:opentelemetry", "dep:tracing-opentelemetry"]
live-voice = ["dep:cpal"]

[dependencies]
anyhow.workspace = true
async-stream.workspace = true
async-trait.workspace = true
cpal = { version = "0.18", optional = true }
futures.workspace = true
gaggle-db.workspace = true
jsonwebtoken = { version = "11", optional = true }
llama-cpp-2 = { version = "0.1", optional = true }
minijinja = { workspace = true, features = ["serde"] }
opentelemetry = { version = "0.33", optional = true }
reqwest = { workspace = true, features = ["multipart"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-opentelemetry = { version = "0.34", optional = true }
tracing-subscriber.workspace = true
uuid.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["sync-secret-service"] }
