name: Generate PR Release Summary

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  generate-pr-summary:
    name: Build Promotion PR Summary (development -> main)
    if: github.event.pull_request.head.ref == 'development'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate promotion PR body from git history
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          chmod +x .github/scripts/generate_promotion_pr_body.sh
          .github/scripts/generate_promotion_pr_body.sh "$BASE_SHA" "$HEAD_SHA" > pr_body.md
          gh pr edit "$PR_NUMBER" --body-file pr_body.md
