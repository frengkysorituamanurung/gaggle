name: Package Desktop Builds

on:
  pull_request:
    branches:
      - development
      - main
  push:
    branches:
      - development
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS ${{ matrix.artifact_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact_name: Gaggle-macOS-arm64
            runner: macos-latest
            target: aarch64-apple-darwin
          - artifact_name: Gaggle-macOS-x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
    uses: ./.github/workflows/reusable-build.yml
    with:
      platform: macos
      runner: ${{ matrix.runner }}
      target: ${{ matrix.target }}
      artifact_name: ${{ matrix.artifact_name }}
      signing: false

  linux:
    name: Linux ${{ matrix.artifact_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact_name: Gaggle-linux-x86_64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - artifact_name: Gaggle-linux-aarch64
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
    uses: ./.github/workflows/reusable-build.yml
    with:
      platform: linux
      runner: ${{ matrix.runner }}
      target: ${{ matrix.target }}
      artifact_name: ${{ matrix.artifact_name }}
      signing: false

  manifest:
    name: Validate and summarize packages
    needs:
      - macos
      - linux
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Download package artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: Gaggle-*-${{ github.sha }}
          path: dist
          merge-multiple: true

      - name: Generate manifest and checksum file
        env:
          WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          .github/scripts/generate-build-manifest.sh \
            --dist "$PWD/dist" \
            --version "$VERSION" \
            --commit "$GITHUB_SHA" \
            --git-ref "$GITHUB_REF" \
            --workflow-run-url "$WORKFLOW_RUN_URL" \
            --expected-count 4

      - name: Upload build manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Gaggle-build-manifest-${{ github.sha }}
          path: |
            dist/build-manifest.json
            dist/SHA256SUMS
          if-no-files-found: error
          overwrite: true
          retention-days: 14
